services:
  db:
    image: mysql:8.4
    container_name: tax-cal-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tax_return_system
      MYSQL_USER: tax_app
      MYSQL_PASSWORD: tax_app_password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tax-cal-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: tax_return_system
      DB_USER: tax_app
      DB_PASSWORD: tax_app_password
      APP_PORT: 8080
      DISPLAY: :99
      VNC_PORT: 5900
      NOVNC_PORT: 6080
      COMPILE_ON_START: "true"
    ports:
      - "6080:6080"
    volumes:
      - ./src:/app/src
      - ./lib:/app/lib:ro
      - app_bin:/app/bin

volumes:
  mysql_data:
  app_bin:
